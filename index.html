    <script>
      // Gracefully mock Vite HMR WebSocket in sandbox iframe environment where WebSockets cannot connect
      (function() {
        // Intercept console.error to silence expected Vite HMR connection closed messages
        const originalConsoleError = console.error;
        console.error = function(...args) {
          const message = args.map(function(arg) {
            if (!arg) return '';
            if (typeof arg === 'string') return arg;
            if (arg instanceof Error) return arg.message + ' ' + (arg.stack || '');
            try { return JSON.stringify(arg); } catch(e) { return String(arg); }
          }).join(' ');

          if (
            message.includes('WebSocket closed without opened') ||
            message.includes('failed to connect to websocket') ||
            (message.includes('[vite]') && (message.includes('WebSocket') || message.includes('ws://') || message.includes('wss://'))) ||
            (args[0] === '[vite]' && args[1] && (args[1] instanceof Error || typeof args[1] === 'string') && String(args[1]).includes('WebSocket'))
          ) {
            return;
          }
          originalConsoleError.apply(console, args);
        };

        // Intercept window error and unhandledrejection
        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || (event.error && event.error.message))) || '';
          if (msg.includes('WebSocket') || msg.includes('ws://') || msg.includes('wss://')) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = reason ? (reason.message || String(reason)) : '';
          if (msg.includes('WebSocket') || msg.includes('ws://') || msg.includes('wss://')) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        // Mock WebSocket for Vite HMR so Vite client resolves its connection promise cleanly without throwing
        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            var urlStr = String(url || '');
            var isViteHmr = 
              protocols === 'vite-hmr' ||
              (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
              urlStr.includes('vite-hmr') ||
              urlStr.includes('token=');

            if (isViteHmr) {
              var listeners = {};
              var mockSocket = {
                readyState: 1, // OPEN
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                url: urlStr,
                protocol: 'vite-hmr',
                extensions: '',
                bufferedAmount: 0,
                binaryType: 'blob',
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
                send: function() {},
                close: function() {
                  mockSocket.readyState = 3;
                  var ev = new Event('close');
                  if (mockSocket.onclose) mockSocket.onclose(ev);
                  (listeners['close'] || []).forEach(function(cb) { cb(ev); });
                },
                addEventListener: function(type, listener) {
                  listeners[type] = listeners[type] || [];
                  listeners[type].push(listener);
                },
                removeEventListener: function(type, listener) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function(cb) { return cb !== listener; });
                  }
                },
                dispatchEvent: function(event) {
                  var handlers = listeners[event.type] || [];
                  handlers.forEach(function(cb) { cb(event); });
                  return true;
                }
              };

              setTimeout(function() {
                var openEv = new Event('open');
                if (mockSocket.onopen) mockSocket.onopen(openEv);
                (listeners['open'] || []).forEach(function(cb) { cb(openEv); });
              }, 0);

              return mockSocket;
            }

            return new OriginalWebSocket(url, protocols);
          };

          window.WebSocket.CONNECTING = OriginalWebSocket.CONNECTING;
          window.WebSocket.OPEN = OriginalWebSocket.OPEN;
          window.WebSocket.CLOSING = OriginalWebSocket.CLOSING;
          window.WebSocket.CLOSED = OriginalWebSocket.CLOSED;
          window.WebSocket.prototype = OriginalWebSocket.prototype;
        }
      })();
    </script>
